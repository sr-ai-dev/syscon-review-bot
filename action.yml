name: 'Syscon Spec Alignment Review'
description: 'PR이 명시한 스펙·요구사항과 코드 변경의 정합성을 자동 검토'
author: 'sr-ai-dev'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  openai-key:
    description: 'OpenAI API key'
    required: true
  github-token:
    description: 'GitHub token for posting reviews'
    required: false
    default: ${{ github.token }}
  model:
    description: 'OpenAI model ID (overrides config and OPENAI_MODEL env)'
    required: false
    default: ''
  config-path:
    description: 'Path to review config in target repo'
    required: false
    default: '.github/review-bot.yml'
  max-review-cost-usd:
    description: 'Trusted hard cost cap per PR in USD'
    required: false
    default: '1.00'
  max-review-requests:
    description: 'Maximum OpenAI requests per PR'
    required: false
    default: '12'
  max-completion-tokens:
    description: 'Maximum completion tokens per OpenAI request'
    required: false
    default: '4096'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run review
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW_MODEL_OVERRIDE: ${{ inputs.model }}
        REVIEW_CONFIG_PATH: ${{ inputs.config-path }}
        REVIEW_MAX_COST_USD: ${{ inputs.max-review-cost-usd }}
        REVIEW_MAX_REQUESTS: ${{ inputs.max-review-requests }}
        REVIEW_MAX_COMPLETION_TOKENS: ${{ inputs.max-completion-tokens }}
        PYTHONPATH: ${{ github.action_path }}
      run: python ${{ github.action_path }}/src/cli.py
